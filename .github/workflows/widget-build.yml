name: Widget build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  widget-build:
    name: Verify widget artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Rebuild and compare committed assets
        run: pnpm check-widget
